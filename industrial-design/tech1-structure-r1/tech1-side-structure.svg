<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <style>
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .sub { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .label { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .note { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #374151; }
      .small { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #6b7280; }
      .body { fill: #e5e7eb; stroke: #111827; stroke-width: 2; }
      .arm { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .monitor { fill: #9ca3af; stroke: #374151; stroke-width: 2; }
      .pad { fill: #111827; opacity: 0.18; }
      .dim { stroke: #6b7280; stroke-width: 1.4; marker-start: url(#a); marker-end: url(#a); }
      .leader { stroke: #6b7280; stroke-width: 1.4; marker-end: url(#a); fill: none; }
      .guide { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 6 5; fill: none; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1600" height="920" fill="#f8fafc"/>
  <text x="70" y="70" class="title">Bell Robot Tech1 挂屏结构说明图</text>
  <text x="70" y="105" class="sub">参考显示屏挂灯的重力挂屏逻辑，不采用强夹紧弹簧结构。</text>

  <g transform="translate(120,170)">
    <text x="0" y="-24" class="label">侧视结构基线</text>
    <rect x="320" y="130" width="46" height="430" rx="8" class="monitor"/>
    <rect x="270" y="120" width="76" height="24" rx="10" class="pad"/>
    <rect x="350" y="182" width="32" height="90" rx="12" class="pad"/>

    <path d="M0,78
             Q6,20 70,20
             L214,20
             Q248,20 248,50
             L248,78
             Z" class="body"/>
    <path d="M248,50
             Q288,66 328,108
             L328,135
             L204,135
             L204,112
             Q215,95 248,50 Z" class="arm"/>
    <path d="M328,108
             L464,108
             L464,136
             L414,136
             L414,304
             Q414,338 382,338
             L370,338
             Q344,338 344,312
             L344,136
             L328,136 Z" class="arm"/>

    <rect x="10" y="66" width="92" height="34" rx="6" fill="#111827" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="152" cy="75" r="16" fill="#111827" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="152" cy="75" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.4"/>
    <rect x="214" y="64" width="18" height="18" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>

    <line x1="0" y1="380" x2="248" y2="380" class="dim"/>
    <text x="100" y="405" class="label">前主机深度 17-19</text>

    <line x1="248" y1="430" x2="464" y2="430" class="dim"/>
    <text x="298" y="455" class="label">后伸量 32-38</text>

    <line x1="502" y1="130" x2="502" y2="560" class="dim"/>
    <text x="520" y="350" class="label">显示器厚度 8-35</text>

    <path d="M150,130 A70 70 0 0 0 220,118" class="guide"/>
    <text x="112" y="160" class="note">镜头下俯 6-10°</text>

    <path d="M346,180 Q368,168 379,186" class="leader"/>
    <text x="382" y="188" class="note">后接触软垫</text>

    <path d="M286,118 Q290,102 310,96" class="leader"/>
    <text x="314" y="98" class="note">主支点 / 挂点</text>

    <path d="M190,135 Q172,156 135,162" class="leader"/>
    <text x="32" y="170" class="note">前接触软垫</text>
  </g>

  <g transform="translate(830,170)">
    <text x="0" y="-24" class="label">结构判断与约束</text>

    <rect x="0" y="0" width="640" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="36" class="label">为什么采用挂灯式结构</text>
    <text x="24" y="68" class="note">1. 对不同显示器厚度更宽容，不需要很大的夹紧力。</text>
    <text x="24" y="98" class="note">2. 更适合 Tech1 的极简条形体，前面可以做得更干净。</text>
    <text x="24" y="128" class="note">3. 开发板原型阶段不必先解决复杂转轴或弹簧件。</text>
    <text x="24" y="158" class="note">4. 后续即便换自定义板，这套受力逻辑也仍然成立。</text>

    <rect x="0" y="210" width="640" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="246" class="label">当前最需要在 3D 里先验证的点</text>
    <text x="24" y="278" class="note">1. 右端双 USB 外露后，端面厚度是否被迫变胖。</text>
    <text x="24" y="308" class="note">2. 主板和扬声器是否能通过上下分层保持正面薄感。</text>
    <text x="24" y="338" class="note">3. 挂点厚度与后支撑臂连接是否会把中部撑厚。</text>
    <text x="24" y="368" class="note">4. 镜头下俯后，屏幕上沿是否遮挡视野。</text>
    <text x="24" y="398" class="note">5. 超薄屏挂靠模式是否需要单独的硅胶垫件。</text>

    <rect x="0" y="460" width="640" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="496" class="label">建议的后续动作</text>
    <text x="24" y="528" class="note">1. 先用 1:1 顶视图切纸板，验证正面秩序和器件冲突。</text>
    <text x="24" y="558" class="note">2. 实测 USB 外壳、插头外伸、摄像头厚度和镜头圈高度。</text>
    <text x="24" y="588" class="note">3. 用这张侧视逻辑做第一版 3D 体块，不急着画细节倒角。</text>
    <text x="24" y="618" class="note">4. 先验证受力和包络，再去做 Tech1 的外观锐度。</text>
    <text x="24" y="648" class="note">5. 如果原型阶段体积超出预期，再考虑把开发板改成自定义板。</text>
  </g>
</svg>
