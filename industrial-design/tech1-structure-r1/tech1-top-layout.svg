<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .sub { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .label { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .note { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #374151; }
      .small { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #6b7280; }
      .outline { stroke: #111827; stroke-width: 2; fill: #f8fafc; }
      .inner { stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 6 4; fill: #ffffff; }
      .oled { fill: #0f172a; stroke: #0891b2; stroke-width: 2; }
      .oled-active { fill: #111827; stroke: #f8fafc; stroke-width: 1.4; }
      .camera { fill: #111827; stroke: #9ca3af; stroke-width: 2; }
      .board { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .speaker { fill: #fde68a; stroke: #d97706; stroke-width: 2; }
      .button { fill: #fecaca; stroke: #dc2626; stroke-width: 2; }
      .service { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 4 4; }
      .zone { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.8; stroke-dasharray: 8 5; }
      .dim { stroke: #6b7280; stroke-width: 1.4; marker-start: url(#a); marker-end: url(#a); }
      .leader { stroke: #6b7280; stroke-width: 1.4; marker-end: url(#a); fill: none; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="70" y="70" class="title">Bell Robot Tech1 平面堆叠说明图</text>
  <text x="70" y="105" class="sub">顶视参考，单位 mm。坐标原点为主机内腔左上角。</text>

  <g transform="translate(80,170)">
    <text x="0" y="-28" class="label">主机顶视布局</text>
    <text x="0" y="-6" class="small">比例约 6 px / mm，便于看清分区与冲突。</text>

    <rect x="0" y="0" width="780" height="204" rx="20" class="outline"/>
    <rect x="18" y="9" width="744" height="186" rx="12" class="inner"/>

    <rect x="24" y="9" width="168" height="168" rx="8" class="oled"/>
    <rect x="24" y="51" width="168" height="90" rx="6" class="oled-active"/>

    <rect x="264" y="51" width="84" height="84" rx="10" class="camera"/>
    <circle cx="306" cy="93" r="22" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="306" cy="93" r="11" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>

    <rect x="360" y="9" width="342" height="168" rx="10" class="board"/>
    <circle cx="648" cy="93" r="36" class="speaker"/>
    <rect x="708" y="75" width="36" height="36" rx="5" class="button"/>
    <rect x="696" y="9" width="66" height="168" rx="8" class="service"/>

    <text x="55" y="90" class="label" fill="#ffffff">OLED 模组</text>
    <text x="54" y="118" class="small" fill="#e5e7eb">28 x 28</text>
    <text x="56" y="161" class="small" fill="#e5e7eb">可视区 28 x 15</text>

    <text x="280" y="26" class="label">摄像头包络</text>
    <text x="279" y="160" class="small">结构包络 14 x 14</text>
    <text x="274" y="176" class="small">本体 9 x 9</text>

    <text x="470" y="80" class="label">开发板</text>
    <text x="452" y="108" class="small">57 x 28</text>
    <text x="452" y="126" class="small">USB 朝右端</text>

    <text x="618" y="48" class="label">扬声器</text>
    <text x="618" y="66" class="small">Ø12</text>
    <text x="608" y="147" class="small">下层 / 底出声</text>

    <text x="700" y="56" class="label">右端服务区</text>
    <text x="708" y="128" class="small">按键 6 x 6</text>

    <line x1="0" y1="228" x2="780" y2="228" class="dim"/>
    <text x="359" y="255" class="label">130</text>

    <line x1="806" y1="0" x2="806" y2="204" class="dim"/>
    <text x="822" y="108" class="label">34</text>

    <line x1="18" y1="286" x2="762" y2="286" class="dim"/>
    <text x="359" y="313" class="note">内腔 124</text>

    <line x1="848" y1="9" x2="848" y2="195" class="dim"/>
    <text x="864" y="108" class="note">内腔 31</text>
  </g>

  <g transform="translate(88,480)">
    <text x="0" y="-24" class="label">关键坐标</text>
    <text x="0" y="10" class="note">OLED：X=4~32, Y=1.5~29.5</text>
    <text x="0" y="40" class="note">摄像头包络：X=44~58, Y=8.5~22.5</text>
    <text x="0" y="70" class="note">开发板：X=60~117, Y=1.5~29.5</text>
    <text x="0" y="100" class="note">扬声器中心：X=108, Y=15.5</text>
    <text x="0" y="130" class="note">按键：X=118~124, Y=12.5~18.5</text>
  </g>

  <g transform="translate(760,470)">
    <text x="0" y="-24" class="label">分层策略</text>
    <rect x="0" y="8" width="280" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
    <text x="20" y="38" class="label">前层</text>
    <text x="20" y="64" class="note">OLED 开窗 / 镜头开孔 / 按键帽</text>

    <rect x="0" y="118" width="280" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="20" y="148" class="label">中层</text>
    <text x="20" y="174" class="note">OLED 模组 / 摄像头支架 / 开发板</text>

    <rect x="0" y="238" width="280" height="100" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <text x="20" y="268" class="label">下层</text>
    <text x="20" y="294" class="note">扬声器 / 支撑臂连接 / USB 走线余量</text>
  </g>

  <g transform="translate(1090,160)">
    <text x="0" y="0" class="label">结构判断</text>
    <text x="0" y="34" class="note">1. 正面秩序仍由 OLED + 中置镜头主导</text>
    <text x="0" y="64" class="note">2. 右端必须同时容纳 USB 开口与按键</text>
    <text x="0" y="94" class="note">3. 扬声器应与主板做 Z 向分层</text>
    <text x="0" y="124" class="note">4. 真正的薄型风险来自挂点和 USB 区</text>
    <text x="0" y="154" class="note">5. 下一步优先补 USB 插头与镜头厚度</text>
  </g>
</svg>
